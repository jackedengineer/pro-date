packages:
  - apps/*
  - packages/*

storeDir: .pnpm-store
cacheDir: .pnpm-cache
nodeLinker: hoisted
savePrefix: ''
engineStrict: true
strictDepBuilds: true

allowBuilds:
  # Ships prebuilt binaries as optional dependencies; its source-build script is not needed.
  '@parcel/watcher@2.6.0': false
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  unrs-resolver@1.12.2: true
  # Cloudflare's runtime for Wrangler; its install script links the platform binary.
  workerd@1.20261103.1: true
